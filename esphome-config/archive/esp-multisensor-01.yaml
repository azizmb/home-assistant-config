substitutions:
  name: esp-multisensor-01
  friendly_name: ESP-MultiSensor-01
  id: esp_multisensor_01

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "lVDpoZgl+yT/BczXlECSvzXrt1fMySPX4Yowcagxjyk="

ota:
  - platform: esphome
    password: "94b5cc1ddbd2e0619410aca24bd4cfd9"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: "WXu8DKSDwUNv"

captive_portal:
    
i2c:
  sda: GPIO06
  scl: GPIO07
  scan: true
  id: bus_a
  frequency: 100kHz

uart:
  tx_pin: GPIO4
  rx_pin: GPIO3
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:


select:
  - platform: ld2410
    distance_resolution:
      name: "${friendly_name} Distance Resolution"
    baud_rate:
      name: "${friendly_name} Baud Rate"
    light_function:
      name: "${friendly_name} Light Function"
    out_pin_level:
      name: "${friendly_name} Out Pin Level"

light:
  - platform: status_led
    name: sys_status
    pin: 
      number: GPIO8
      inverted: True
    internal: True
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: ld2410
    has_target:
      name: "${friendly_name} Presence"
    has_moving_target:
      name: "${friendly_name} Moving Target"
    has_still_target:
      name: "${friendly_name} Still Target"
    out_pin_presence_status:
      name: "${friendly_name} Out Pin Presence Status"

switch:
  - platform: ld2410
    engineering_mode:
      name: "${friendly_name} Engineering Mode"
    bluetooth:
      name: "${friendly_name} Bluetooth"

sensor:
  - platform: ld2410
    light:
      name: "${friendly_name} Light"
    moving_distance:
      name: "${friendly_name} Moving Distance"
    still_distance:
      name: "${friendly_name} Still Distance"
    moving_energy:
      name: "${friendly_name} Move Energy"
    still_energy:
      name: "${friendly_name} Still Energy"
    detection_distance:
      name: "${friendly_name} Detection Distance"

  - platform: aht10
    variant: AHT20
    temperature:
      id: "id_temperature_sensor"
    humidity:
      id: "id_humidity_sensor"
    address: 0x38
    update_interval: 20s

  - platform: ens160_i2c
    eco2:
      name: "${friendly_name} eCO2"
    tvoc:
      name: "${friendly_name} Total Volatile Organic Compounds"
    aqi:
      name: "${friendly_name} Air Quality Index"
      id: "${id}_aqi"
    update_interval: 20s
    address: 0x53
    compensation:
      temperature: id_temperature_sensor
      humidity: id_humidity_sensor

text_sensor:
  - platform: template
    name: "${friendly_name} Air Quality Rating"
    lambda: |-
      switch ( (int) (id(${id}_aqi).state) ) {
        case 1: return {"Excellent"};
        case 2: return {"Good"};
        case 3: return {"Moderate"};
        case 4: return {"Poor"};
        case 5: return {"Unhealthy"};
        default: return {"Not Available"};
      }