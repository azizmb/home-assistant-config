control_bed_heater:
  alias: Control bed heater
  fields:
    heater:
      selector:
        entity: {}
      name: Heater
      required: true
  sequence:
  - action: switch.turn_on
    target:
      entity_id: '{{ heater }}'
  - delay:
      minutes: 30
  - action: switch.turn_off
    target:
      entity_id: '{{ heater }}'


