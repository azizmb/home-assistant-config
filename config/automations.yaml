- id: '1736361791549'
  alias: Set - Bedroom - Night Mode
  description: ''
  triggers:
  - trigger: time
    at: '23:00:00'
  - trigger: state
    entity_id:
    - binary_sensor.esp01_bed_right_occupancy
    - binary_sensor.esp01_bed_left_occupancy
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 20
      seconds: 0
  conditions:
  - condition: time
    after: '21:00:00'
  - condition: state
    entity_id: binary_sensor.occupancy_bedroom
    state: 'on'
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.bedroom_night_mode
  mode: single
