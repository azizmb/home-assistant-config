- id: '1742032071122'
  alias: Bedroom - Night Mode Auto
  description: ''
  triggers:
  - trigger: time
    at: '21:00:00'
    id: night-start
  - trigger: time
    at: 08:00:00
    id: night-end
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - night-start
      sequence:
      - action: fan.set_preset_mode
        metadata: {}
        data:
          preset_mode: sleep
        target:
          device_id: 1bbb1dd386f9e9cf8913340e37688881
    - conditions:
      - condition: trigger
        id:
        - night-end
      sequence:
      - action: fan.set_preset_mode
        metadata: {}
        data:
          preset_mode: auto
        target:
          device_id: 1bbb1dd386f9e9cf8913340e37688881
  mode: single
- id: '1742032398627'
  alias: Bedroom - Clean air when room empty
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.occupancy_bedroom
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: room-empty
  conditions:
  - condition: state
    entity_id: fan.master_bedroom_air_purifier
    attribute: preset_mode
    state: auto
  actions:
  - action: fan.set_percentage
    metadata: {}
    data:
      percentage: 100
    target:
      device_id: 1bbb1dd386f9e9cf8913340e37688881
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - binary_sensor.occupancy_bedroom
      from:
      to: 'on'
    timeout:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - action: fan.set_preset_mode
    metadata: {}
    data:
      preset_mode: auto
    target:
      device_id: 1bbb1dd386f9e9cf8913340e37688881
  mode: single
