- id: "3395120795"
  alias: Global - Grow Lights
  mode: single
  variables:
    max_attempts: 5

  trigger:
    - platform: sun
      event: sunrise
      offset: "01:00:00"
      id: turn_on
    - platform: sun
      event: sunset
      id: turn_off

  condition: []

  action:
    - choose:
        - conditions:
            - condition: trigger
              id: turn_on
          sequence:
            - repeat:
                count: "{{ max_attempts }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: >
                        {{ expand(label_entities('grow light'))
                          | selectattr('state', 'eq', 'off')
                          | map(attribute='entity_id')
                          | list }}
                  - wait_template: >
                      {{ expand(label_entities('grow light'))
                        | selectattr('state', 'eq', 'on')
                        | list | count == expand(label_entities('grow light')) | count }}
                    timeout: "0:00:10"
                    continue_on_timeout: true
                  - condition: template
                    value_template: >
                      {{ expand(label_entities('grow light'))
                        | selectattr('state', 'eq', 'on')
                        | list | count == expand(label_entities('grow light')) | count }}
                  - stop: "All grow lights are on."
                  - delay: "00:05:00"

        - conditions:
            - condition: trigger
              id: turn_off
          sequence:
            - repeat:
                count: "{{ max_attempts }}"
                sequence:
                  - service: light.turn_off
                    target:
                      entity_id: >
                        {{ expand(label_entities('grow light'))
                          | selectattr('state', 'eq', 'on')
                          | map(attribute='entity_id')
                          | list }}
                  - wait_template: >
                      {{ expand(label_entities('grow light'))
                        | selectattr('state', 'eq', 'off')
                        | list | count == expand(label_entities('grow light')) | count }}
                    timeout: "0:00:10"
                    continue_on_timeout: true
                  - condition: template
                    value_template: >
                      {{ expand(label_entities('grow light'))
                        | selectattr('state', 'eq', 'off')
                        | list | count == expand(label_entities('grow light')) | count }}
                  - stop: "All grow lights are off."
                  - delay: "00:05:00"
