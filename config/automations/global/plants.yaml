- id: "3395120795"
  alias: Global - Grow Lights
  mode: single
  variables:
    max_attempts: 5
  trigger:
    - platform: sun
      event: sunrise
      offset: "01:00:00"
      id: turn_on
    - platform: sun
      event: sunset
      id: turn_off
  condition: []
  action:
    - variables:
        labeled_devices: "{{ label_devices('Grow Lights') }}"
        device_light_entities: >
          {{ labeled_devices
               | map('device_entities')
               | sum(start=[])
               | map('expand')
               | sum(start=[])
               | selectattr('domain', 'eq', 'light')
               | map(attribute='entity_id')
               | list }}
        labeled_entities: >
          {{ expand(label_entities('Grow Lights'))
               | selectattr('domain', 'eq', 'light')
               | map(attribute='entity_id')
               | list }}
        grow_light_entities: >
          {{ (device_light_entities + labeled_entities) | unique }}
    - choose:
        - conditions:
            - condition: trigger
              id: turn_on
          sequence:
            - repeat:
                count: "{{ max_attempts }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: >
                        {{ expand(grow_light_entities)
                           | selectattr('state', 'eq', 'off')
                           | map(attribute='entity_id')
                           | list }}
                  - wait_template: >
                      {{ expand(grow_light_entities)
                           | selectattr('state', 'eq', 'on')
                           | list | count == grow_light_entities | count }}
                    timeout: "0:00:10"
                    continue_on_timeout: true
                  - condition: template
                    value_template: >
                      {{ expand(grow_light_entities)
                           | selectattr('state', 'eq', 'on')
                           | list | count == grow_light_entities | count }}
                  - stop: "All grow lights are on."
                  - delay: "00:05:00"
        - conditions:
            - condition: trigger
              id: turn_off
          sequence:
            - repeat:
                count: "{{ max_attempts }}"
                sequence:
                  - service: light.turn_off
                    target:
                      entity_id: >
                        {{ expand(grow_light_entities)
                           | selectattr('state', 'eq', 'on')
                           | map(attribute='entity_id')
                           | list }}
                  - wait_template: >
                      {{ expand(grow_light_entities)
                           | selectattr('state', 'eq', 'off')
                           | list | count == grow_light_entities | count }}
                    timeout: "0:00:10"
                    continue_on_timeout: true
                  - condition: template
                    value_template: >
                      {{ expand(grow_light_entities)
                           | selectattr('state', 'eq', 'off')
                           | list | count == grow_light_entities | count }}
                  - stop: "All grow lights are off."
                  - delay: "00:05:00"
